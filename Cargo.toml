[package]
name = "polars-io-ext"
# Released independently of Polars; compatibility is decided by the plugin IDs it exports (see
# `polars-io-ext-ffi`), not by this version.
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = "https://github.com/pola-rs/polars-iceberg"
description = "Native I/O plugins for Polars (Iceberg, ...), one feature per format."

# Built as a member of the Polars workspace: this repository is cloned (git-ignored) to
# `crates/polars-iceberg` of https://github.com/pola-rs/polars.

[lib]
name = "polars_io_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true, optional = true }
flate2 = { workspace = true, features = ["zlib-rs"], optional = true }
futures = { workspace = true }
hex = { workspace = true, optional = true }
# Used only to build Arrow data, which crosses the plugin boundary through the Arrow C Data
# Interface; this does not couple the plugin to the host's Polars version.
polars-arrow = { workspace = true }
polars-error = { workspace = true }
polars-io-ext-ffi = { workspace = true }
polars-utils = { workspace = true }
pyo3 = { workspace = true, optional = true, features = ["abi3-py310", "extension-module"] }
serde = { workspace = true }
# `float_roundtrip`: filter literals must parse to the exact float PyIceberg serialized.
serde_json = { workspace = true, features = ["float_roundtrip"] }
snap = { version = "1", optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
zstd = { workspace = true, optional = true }

[features]
# `iceberg` is on by default so that tools using default features (e.g. rust-analyzer) cover its
# code; builds of the Polars workspace exclude this crate by default either way.
default = ["iceberg"]
# Iceberg scan planning (`iceberg`), contract `polars.io_plugin.iceberg.v1`.
iceberg = [
  "polars-io-ext-ffi/iceberg",
  "dep:chrono",
  "dep:flate2",
  "dep:hex",
  "dep:snap",
  "dep:zstd",
]
# Python extension module exposing the plugin contracts as PyCapsules (module `polars_iceberg`
# with feature `iceberg`).
python = ["dep:pyo3"]

[lints]
workspace = true
