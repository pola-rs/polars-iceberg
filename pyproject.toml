[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "polars-iceberg"
description = "Native Iceberg scan planning plugin for Polars (dependency of the polars package)"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# From `package.version` in Cargo.toml.
dynamic = ["version"]

[project.urls]
Homepage = "https://www.pola.rs/"
Polars = "https://pypi.org/project/polars/"
Repository = "https://github.com/pola-rs/polars-iceberg"

[tool.maturin]
features = ["python", "iceberg"]
module-name = "polars_iceberg"
# As a workspace member, the sdist gets the license only at `crates/polars-iceberg/LICENSE`, while
# its metadata (`License-File: LICENSE`) points at the root, which PyPI rejects.
include = [{ path = "LICENSE", format = "sdist" }]
