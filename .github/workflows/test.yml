name: Test

# This repository is built as `crates/polars-iceberg` of the Polars workspace, so the jobs check out
# Polars (main branch) and place this repository at that path.

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -C debuginfo=0 # Do not produce debug symbols to keep memory usage down
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: pola-rs/polars

      - uses: actions/checkout@v7
        with:
          path: crates/polars-iceberg

      - name: Set up Rust
        run: rustup component add clippy rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Check formatting
        run: cargo fmt -p polars-io-ext --check

      - name: Run clippy
        run: cargo clippy -p polars-io-ext --all-targets --features iceberg,python -- -D warnings

      - name: Run tests
        run: cargo test --lib --tests --features iceberg -p polars-io-ext

  test-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: py-polars
    steps:
      - uses: actions/checkout@v7
        with:
          repository: pola-rs/polars

      - uses: actions/checkout@v7
        with:
          path: crates/polars-iceberg

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/py-polars/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/py-polars/.venv" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          pip install uv
          uv pip install -U typing-extensions
          uv pip install --compile-bytecode -r requirements-dev.txt -r requirements-ci.txt --index-strategy=unsafe-best-match

      - name: Set up Rust
        run: rustup show

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Install Polars
        run: |
          uv pip uninstall polars-runtime-32 polars-runtime-64 polars-runtime-compat
          pip install --no-deps -e .
          maturin develop --manifest-path runtime/polars-runtime-32/Cargo.toml

      - name: Install polars_iceberg plugin
        run: |
          maturin develop --manifest-path ../crates/polars-iceberg/Cargo.toml
          python -c 'import polars_iceberg'

      - name: Run tests
        env:
          POLARS_TIMEOUT_MS: 60000
        run: pytest -n auto tests/unit/io/test_iceberg_plugin.py tests/unit/io/test_iceberg_plugin_suite.py
